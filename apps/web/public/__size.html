<!doctype html>
<meta charset="utf-8"/>
<style>body{font:11px/1.5 monospace;margin:0;padding:6px}iframe{border:0;position:absolute;left:-20000px}</style>
<div id="f"></div><pre id="out">...</pre>
<script>
const lines=[]; let pending=2;
[1,2].forEach(n=>{
  const f=document.createElement('iframe'); f.width=1280; f.height=2600; f.src='/?x='+n+Math.random();
  f.onload=()=>setTimeout(()=>{
    const d=f.contentDocument, row=d.querySelector('main > div'), rail=row.children[1];
    const imgs=[...rail.querySelectorAll('img')];
    lines.push('load '+n+'  rail '+Math.round(rail.getBoundingClientRect().width)+'px');
    let areas=[];
    imgs.forEach(i=>{const r=i.getBoundingClientRect();
      const nat=i.naturalWidth/i.naturalHeight;
      const box=r.width/r.height;
      const pw=nat>box?r.width:r.height*nat, ph=nat>box?r.width/nat:r.height;
      areas.push(Math.round(pw*ph));
      lines.push('   cell '+String(Math.round(r.width)).padStart(3)+'x'+String(Math.round(r.height)).padStart(3)
        +'   artwork '+String(Math.round(pw)).padStart(3)+'x'+String(Math.round(ph)).padStart(3)
        +'  '+String(Math.round(pw*ph/1000)).padStart(3)+'k');});
    const mx=Math.max(...areas), mn=Math.min(...areas);
    lines.push('   biggest artwork is '+(mx/mn).toFixed(2)+'x the smallest');
    if(--pending===0) document.getElementById('out').textContent=lines.join('\n');
  },3000);
  document.getElementById('f').appendChild(f);
});
</script>
