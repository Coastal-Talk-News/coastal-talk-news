<!DOCTYPE html>
<html>
<head><title>driver2</title></head>
<body>
<pre id="log"></pre>
<script>
function log(...args) {
  document.getElementById('log').textContent += args.map(a => typeof a === 'string' ? a : JSON.stringify(a)).join(' ') + '\n';
}
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
function setNativeValue(el, value) {
  const proto = Object.getPrototypeOf(el);
  const desc = Object.getOwnPropertyDescriptor(proto, 'value');
  desc.set.call(el, value);
  el.dispatchEvent(new Event('input', { bubbles: true }));
}

async function main() {
  const iframe = document.createElement('iframe');
  iframe.style.width = '1280px';
  iframe.style.height = '900px';
  document.body.appendChild(iframe);
  iframe.src = '/login';
  await sleep(1200);

  const doc = iframe.contentDocument;
  const win = iframe.contentWindow;
  win.__consoleErrors = [];
  const origError = win.console.error.bind(win.console);
  win.console.error = (...args) => { win.__consoleErrors.push(args.map(String).join(' ')); origError(...args); };

  setNativeValue(doc.querySelector('input[type="email"]'), 'admin@coastaltalknews.com');
  setNativeValue(doc.querySelector('input[type="password"]'), 'Admin@123');
  doc.querySelector('button[type="submit"]').click();
  await sleep(2200);

  const advLink = [...doc.querySelectorAll('a')].find((a) => a.textContent.trim() === 'Advertisements');
  advLink.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
  await sleep(1200);

  const addBtn = [...doc.querySelectorAll('button')].find((b) => b.textContent.includes('Add Advertisement'));
  log('add button found:', !!addBtn);
  addBtn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  await sleep(700);

  // Start defaults to "now". Open the End date calendar and inspect whether
  // days before today are disabled (they never can be, since start=now, but
  // this at least confirms the wiring/rendering doesn't break). The real
  // test: open End date calendar, click Today (same day as start), then
  // check the End hour/minute/period options for disabled entries that
  // would fall at/before the current time.
  const endDateBtn = doc.querySelector('button[aria-label="End date"]');
  log('end date trigger found:', !!endDateBtn);
  endDateBtn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  await sleep(300);
  const todayBtn = [...doc.querySelectorAll('button')].find((b) => b.textContent.trim() === 'Today');
  todayBtn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  await sleep(300);
  log('end date set to today (same as start date by default)');

  // Open End hour segment and check for disabled options.
  const hourInput = doc.querySelector('input[aria-label="End time - hour"]');
  hourInput.focus();
  await sleep(300);
  const hourOptions = [...doc.querySelectorAll('[role="listbox"] [role="option"]')];
  const hourDisabledCount = hourOptions.filter((li) => li.getAttribute('aria-disabled') === 'true').length;
  log('hour options total:', hourOptions.length, 'disabled:', hourDisabledCount);
  // close this popover
  doc.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  hourInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
  await sleep(200);

  const nowStr = new Date().toString();
  log('headless chrome current time:', nowStr);

  // Try to click a disabled hour option directly (should not select it / no change)
  hourInput.focus();
  await sleep(300);
  const disabledHourBtn = [...doc.querySelectorAll('[role="listbox"] [role="option"] button')].find((b) => b.disabled);
  log('found a disabled hour button to test-click:', !!disabledHourBtn, disabledHourBtn ? disabledHourBtn.textContent : null);
  if (disabledHourBtn) {
    disabledHourBtn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    await sleep(200);
    log('hour input value after clicking a disabled option (should be unchanged/blank):', hourInput.value);
  }

  // Now check the PERIOD segment - AM should very likely be disabled since default start is daytime (11-12 range) typically, but not guaranteed - just report state.
  hourInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
  await sleep(200);
  const periodInput = doc.querySelector('input[aria-label="End time - AM or PM"]');
  periodInput.focus();
  await sleep(300);
  const periodOptions = [...doc.querySelectorAll('[role="listbox"] [role="option"]')].map((li) => ({
    text: li.textContent.trim(),
    disabled: li.getAttribute('aria-disabled') === 'true',
  }));
  log('period options:', JSON.stringify(periodOptions));

  log('console errors:', JSON.stringify(win.__consoleErrors || []));
  log('DONE');
}
main().catch((e) => log('SCRIPT ERROR', e.message, e.stack));
</script>
</body>
</html>
