<!doctype html>
<html lang="en" data-palette="graphite">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The reader site's article fonts, so the editor's preview reads the way the page will. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Kannada:wght@400;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Coastal Talk News CMS</title>
    <script>
      // Runs before first paint so a dark-mode (or non-default palette) user
      // never sees a flash of the wrong theme. Mirrors ThemeProvider's
      // storage keys and resolution rules.
      (function () {
        try {
          var stored = localStorage.getItem('ctn-theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          // Blocked storage just means the default theme applies.
        }
        var palette;
        try {
          palette = localStorage.getItem('ctn-palette');
          if (
            palette === 'graphite' ||
            palette === 'terracotta' ||
            palette === 'forest' ||
            palette === 'plum' ||
            palette === 'classic' ||
            palette === 'custom'
          ) {
            document.documentElement.dataset.palette = palette;
          }
        } catch (error) {
          // Blocked storage just means the default palette applies.
        }
        if (palette === 'custom') {
          try {
            var accent = localStorage.getItem('ctn-custom-accent');
            if (accent && /^#[0-9a-f]{6}$/i.test(accent)) {
              var r = parseInt(accent.slice(1, 3), 16);
              var g = parseInt(accent.slice(3, 5), 16);
              var b = parseInt(accent.slice(5, 7), 16);
              var luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
              document.documentElement.style.setProperty(
                '--accent-base',
                accent,
              );
              document.documentElement.style.setProperty(
                '--accent-fg',
                luminance > 0.6 ? '#09090b' : '#fafafa',
              );
            }
          } catch (error) {
            // Blocked storage just means the fallback custom colour applies.
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
